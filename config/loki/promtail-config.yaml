server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: dockerlogs
          __path__: /host/containers/*/*log
    pipeline_stages:
      # 1. Parse inicial do JSON do Docker
      - json:
          expressions:
            output: log
            stream: stream

      # 2. Tentar parsear o conteúdo da aplicação (logger.py)
      - json:
          expressions:
            level: level
            loggerName: loggerName
            correlationId: correlationId
            traceId: traceId
          source: output

      # 3. Criar a label is_app baseada na existência do loggerName
      - template:
          source: is_app
          template: '{{ if .loggerName }}true{{ else }}false{{ end }}'

      # 4. Promover labels (Baixa cardinalidade)
      - labels:
          level:
          is_app:
          stream:

      # 5. Metadados estruturados (Alta cardinalidade - Loki 3.0)
      - structured_metadata:
          correlationId:
          traceId:
          loggerName:

      # 6. Limpeza da saída
      - output:
          source: output
