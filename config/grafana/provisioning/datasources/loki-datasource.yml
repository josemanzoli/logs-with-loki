apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: '"traceId":\s*"([a-f0-9]{32})"'
          name: "Open Trace in Tempo"
          url: "$${__value.raw}"
          internalLinkEnabled: true
